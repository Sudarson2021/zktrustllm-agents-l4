name: paper258-artifact

on:
  pull_request:
  push:
    branches:
      - l4-journal-evidence-hardening-*
      - l4-supervisor258-n8n-multimodel
      - l4-zktrustllm-agents
      - agent/tnsm-*
      - tnsm-supervisor-revision-*

jobs:
  lightweight-artifact-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-paper258.txt

      - name: Syntax checks
        run: |
          bash -n scripts/reproduce_paper_258.sh
          bash -n scripts/l4/media/run_packet_capture_smoke.sh
          bash -n scripts/l4/zk/collect_auth_v2_timing_guarded.sh
          python -m py_compile scripts/l4/validation/validate_paper_258_claims.py
          python -m py_compile scripts/l4/validation/build_evidence_manifest.py
          python -m py_compile scripts/l4/validation/summarize_ai_evidence.py
          python -m py_compile scripts/l4/tnsm_revision/run_langgraph_baseline.py
          python -m py_compile scripts/l4/tnsm_revision/run_open_weights_baseline.py
          python -m py_compile scripts/l4/tnsm_revision/preflight_experiments.py
          python -m py_compile scripts/l4/tnsm_revision/export_frozen_oracle.py
          python -m py_compile scripts/l4/tnsm_revision/generate_prompt_injection_suite.py
          python -m py_compile scripts/l4/tnsm_revision/run_prompt_injection_experiment.py
          python -m py_compile scripts/l4/tnsm_revision/score_prompt_injection.py
          python -m py_compile scripts/l4/tnsm_revision/make_human_label_subset.py
          python -m py_compile scripts/l4/tnsm_revision/analyze_human_labels.py
          python -m py_compile scripts/l4/tnsm_revision/audit_model_metadata.py
          python -m py_compile scripts/l4/tnsm_revision/analyze_http_failures.py
          python -m py_compile scripts/l4/tnsm_revision/verify_revision_package.py
          bash -n scripts/l4/tnsm_revision/run_preflight.sh
          bash -n scripts/l4/tnsm_revision/run_oracle_export.sh
          bash -n scripts/l4/tnsm_revision/run_langgraph_external_baseline.sh
          bash -n scripts/l4/tnsm_revision/run_open_weights_qwen3_4b.sh
          bash -n scripts/l4/tnsm_revision/run_prompt_injection_experiment.sh
          bash -n scripts/l4/tnsm_revision/run_http_failure_analysis.sh
          bash -n scripts/l4/tnsm_revision/run_model_metadata_audit.sh
          node -c scripts/l4/zk/deploy_auth_v2_2_localhost.js

      - name: Lightweight claim validation
        run: |
          python -m unittest discover -s test/l4/tnsm_revision -p 'test_*.py'
          python scripts/l4/validation/summarize_ai_evidence.py
          python scripts/l4/validation/validate_paper_258_claims.py
          python scripts/l4/validation/build_evidence_manifest.py
          cat artifacts/out/paper_258/validation/claim_validation_report.md

      - name: Upload lightweight paper258 artifact report
        uses: actions/upload-artifact@v4
        with:
          name: paper258-lightweight-artifact-report
          path: |
            artifacts/out/paper_258/validation/claim_validation_report.md
            artifacts/out/paper_258/validation/claim_validation_report.json
            artifacts/out/paper_258/evidence_manifest.json
            artifacts/out/paper_258/ai_evidence/ai_evidence_summary.md
            artifacts/out/paper_258/ai_evidence/ai_evidence_summary.json
